<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2c3e50;
    user-select: none;
  }
  .wrap {
    text-align: center;
    padding: 16px;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 6px;
    margin-bottom: 10px;
    color: #34495e;
  }
  .info {
    display: flex;
    justify-content: space-between;
    width: 480px;
    max-width: 100%;
    margin: 0 auto 10px;
    font-size: 15px;
  }
  .info span b { color: #e74c3c; font-size: 20px; }
  canvas {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(52, 73, 94, .18);
    display: block;
    margin: 0 auto;
    max-width: 100%;
    touch-action: none;
  }
  .tips {
    margin-top: 12px;
    font-size: 13px;
    color: #7f8c8d;
    line-height: 1.8;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 62, 80, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { transform: scale(.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .panel h2 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #2c3e50;
  }
  .panel p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
  .panel button {
    background: linear-gradient(135deg, #ff6b6b, #e74c3c);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 40px;
    font-size: 17px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform .15s, box-shadow .15s;
  }
  .panel button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(231, 76, 60, .4);
  }
  .final-score { font-size: 42px; color: #e74c3c; font-weight: bold; margin-bottom: 4px; }
  .new-record { color: #f39c12; font-weight: bold; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>贪 吃 蛇</h1>
  <div class="info">
    <span>得分：<b id="score">0</b></span>
    <span>最高：<b id="best">0</b></span>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <div class="tips">
    方向键 / WASD 控制 · 空格暂停<br>
    手机可滑动手势操作
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="panelTitle">贪吃蛇</h2>
    <div class="final-score" id="finalScore" style="display:none">0</div>
    <p id="panelDesc">吃掉食物变长，别撞墙也别咬到自己！</p>
    <div class="new-record" id="newRecord">🎉 新纪录！</div>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 24;                 // 每格像素
  const COLS = canvas.width / GRID; // 20
  const ROWS = canvas.height / GRID;

  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $overlay = document.getElementById('overlay');
  const $panelTitle = document.getElementById('panelTitle');
  const $panelDesc = document.getElementById('panelDesc');
  const $finalScore = document.getElementById('finalScore');
  const $newRecord = document.getElementById('newRecord');
  const $startBtn = document.getElementById('startBtn');

  let snake, dir, nextDir, food, score, best, speed, timer, paused, alive, eatAnim;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  $best.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 150;      // ms 每步，越小越快
    paused = false;
    alive = false;
    eatAnim = 0;
    $score.textContent = '0';
    placeFood();
  }

  function placeFood() {
    let ok = false;
    while (!ok) {
      food = {x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0};
      ok = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function step() {
    if (paused || !alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      $score.textContent = score;
      eatAnim = 6;
      placeFood();
      // 逐渐加速，下限 70ms
      if (speed > 70) {
        speed -= 3;
        clearInterval(timer);
        timer = setInterval(step, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    // 背景棋盘
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f4f7fa';
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * GRID, y * GRID, GRID, GRID);

    // 食物（苹果）
    const fx = food.x * GRID + GRID / 2, fy = food.y * GRID + GRID / 2;
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.08;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(0, 1, GRID * 0.34, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -GRID * 0.3);
    ctx.quadraticCurveTo(3, -GRID * 0.45, 6, -GRID * 0.42);
    ctx.stroke();
    ctx.restore();

    // 蛇身
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(n - 1, 1);
      // 头部深、尾部浅
      const r = Math.round(46 + t * 30);
      const g = Math.round(160 + t * 40);
      const b = Math.round(90 + t * 40);
      ctx.fillStyle = i === 0 ? '#27ae60' : `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, 6);
      ctx.fill();
    }

    // 眼睛
    const h = snake[0];
    const cx = h.x * GRID + GRID / 2, cy = h.y * GRID + GRID / 2;
    const ex = dir.y !== 0 ? 4 : 3 * dir.x;
    const ey = dir.x !== 0 ? 4 : 3 * dir.y;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + (dir.y !== 0 ? -5 : 4 * dir.x), cy + (dir.x !== 0 ? -5 : 4 * dir.y), 3, 0, Math.PI * 2);
    ctx.arc(cx + (dir.y !== 0 ? 5 : 4 * dir.x), cy + (dir.x !== 0 ? 5 : 4 * dir.y), 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath();
    ctx.arc(cx + (dir.y !== 0 ? -5 : 5 * dir.x), cy + (dir.x !== 0 ? -5 : 5 * dir.y), 1.5, 0, Math.PI * 2);
    ctx.arc(cx + (dir.y !== 0 ? 5 : 5 * dir.x), cy + (dir.x !== 0 ? 5 : 5 * dir.y), 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (eatAnim > 0) eatAnim--;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    $panelTitle.textContent = '游戏结束';
    $panelDesc.textContent = '再挑战一次？';
    $finalScore.style.display = 'block';
    $finalScore.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      $best.textContent = best;
      $newRecord.style.display = 'block';
    } else {
      $newRecord.style.display = 'none';
    }
    $startBtn.textContent = '再来一局';
    $overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    alive = true;
    $overlay.classList.add('hidden');
    $finalScore.style.display = 'none';
    $newRecord.style.display = 'none';
    clearInterval(timer);
    timer = setInterval(step, speed);
    draw();
  }

  function setDir(nx, ny) {
    // 禁止 180 度掉头
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = {x: nx, y: ny};
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ' && alive) {
      paused = !paused;
      $panelTitle.textContent = '暂停中';
      $panelDesc.textContent = '按空格或点击按钮继续';
      $startBtn.textContent = '继续游戏';
      if (paused) {
        $overlay.classList.remove('hidden');
      } else {
        $overlay.classList.add('hidden');
      }
      $startBtn.onclick = pausedResume;
    }
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  });

  function pausedResume() {
    if (paused && alive) {
      paused = false;
      $overlay.classList.add('hidden');
      $startBtn.onclick = start;
    }
  }

  $startBtn.onclick = start;

  // 触屏滑动
  let tx = 0, ty = 0;
  canvas.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive: true});
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  reset();
  draw();
})();
</script>
</body>
</html>
